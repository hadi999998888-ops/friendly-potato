
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Stars</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{
min-height:100vh;
background:radial-gradient(ellipse at top,#34205d,#100d1c 65%,#080810);
color:white;display:flex;align-items:center;
justify-content:center;padding:20px;
}
.card{
width:100%;max-width:390px;padding:30px 23px;
border:1px solid #ffffff18;border-radius:25px;
background:#171526ee;text-align:center;
box-shadow:0 20px 80px #0009;
}
.logo{font-size:60px;margin-bottom:18px}
h1{font-size:25px;margin-bottom:13px}
p{color:#aaa8bd;font-size:14px;line-height:1.6;margin-bottom:23px}
input{
width:100%;padding:17px;border-radius:13px;
border:1px solid #44405e;background:#242138;
color:white;font-size:15px;outline:none;
margin-bottom:15px;
}
button{
width:100%;padding:16px;border:0;border-radius:13px;
font-size:15px;font-weight:bold;margin-top:10px;
cursor:pointer;
}
.primary{
color:white;background:linear-gradient(110deg,#8052ff,#bd69ff);
box-shadow:0 5px 25px #8954ff44;
}
.secondary{background:#29263d;color:white}
#main,#loading,#videoScreen{display:none}
#captcha{font-size:28px;margin:20px}
.error{color:#ff6262;font-size:13px;margin-top:10px}
.spinner{
width:65px;height:65px;border:5px solid #ffffff20;
border-top-color:#a56aff;border-radius:50%;
margin:30px auto;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{
height:9px;background:#302b43;border-radius:20px;
overflow:hidden;margin:25px 0 12px;
}
.bar{
height:100%;width:0%;
background:linear-gradient(90deg,#8254ff,#d17aff);
border-radius:20px;transition:width .15s;
}
#percent{font-size:13px;color:#bca5ff}
#videoScreen{
position:fixed;inset:0;background:black;z-index:9999;
}
#videoScreen video{
width:100%;height:100%;object-fit:contain;
}
</style>
</head>
<body>

<div class="card" id="robot">
<div class="logo">⭐</div>
<h1>Проверка безопасности</h1>
<p>Решите простой пример, чтобы продолжить.</p>
<div id="captcha"></div>
<input id="answer" type="number" placeholder="Введите ответ">
<button class="primary" onclick="checkCaptcha()">Продолжить</button>
<div class="error" id="error"></div>
</div>

<div class="card" id="main">
<div class="logo">⭐</div>
<h1>Telegram Stars</h1>
<p>Введите свой юзернейм для участия в розыгрыше.</p>
<input id="username" placeholder="@username">
<button class="primary" onclick="startLoading()">⭐ Получить звёзды</button>
<button class="secondary" onclick="startLoading()">↩ Назад</button>
</div>

<div class="card" id="loading">
<div class="logo">⭐</div>
<h1>Пополнение Stars</h1>
<p style="color:#c4a8ff;font-weight:bold">
⏳ Не выходите из сайта мы пополняем звёзды!
</p>
<div class="spinner"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="percent">0%</div>
<p style="margin-top:20px;margin-bottom:0">
Пожалуйста, дождитесь завершения процесса...
</p>
</div>

<div id="videoScreen">
<video id="video"
playsinline
preload="auto"
disablepictureinpicture
controlslist="nodownload nofullscreen noremoteplayback"
oncontextmenu="return false">
<source src="V.mp4" type="video/mp4">
</video>
</div>

<script>
let a,b,correct;

function newCaptcha(){
a=Math.floor(Math.random()*9)+1;
b=Math.floor(Math.random()*9)+1;
correct=a+b;
document.getElementById('captcha').textContent=a+' + '+b+' = ?';
}

function checkCaptcha(){
let value=document.getElementById('answer').value;
if(value!=='' && Number(value)===correct){
document.getElementById('robot').style.display='none';
document.getElementById('main').style.display='block';
}else{
document.getElementById('error').textContent='Неверный ответ!';
document.getElementById('answer').value='';
newCaptcha();
}
}

async function startLoading(){
document.getElementById('main').style.display='none';
document.getElementById('loading').style.display='block';

let progress=0;
let bar=document.getElementById('bar');
let percent=document.getElementById('percent');

let timer=setInterval(()=>{
progress+=2;
bar.style.width=progress+'%';
percent.textContent=progress+'%';

if(progress>=100){
clearInterval(timer);
showScreamer();
}
},70);
}

async function showScreamer(){
const screen=document.getElementById('videoScreen');
const video=document.getElementById('video');

screen.style.display='block';
video.currentTime=0;
video.muted=false;

try{
await screen.requestFullscreen();
}catch(e){}

try{
await video.play();
}catch(e){
// Если браузер запретил звук, пользователь может нажать
// на экран для запуска видео.
screen.onclick=()=>{
video.muted=false;
video.play();
screen.onclick=null;
};
}
}

newCaptcha();
</script>
</body>
</html>

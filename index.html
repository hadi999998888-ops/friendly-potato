
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stars | Получение звёзд</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #25204b, #090914 65%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 390px;
    padding: 30px 23px;
    border: 1px solid #ffffff18;
    border-radius: 25px;
    background: #151526e8;
    box-shadow: 0 15px 70px #0008;
    text-align: center;
}

.logo {
    font-size: 55px;
    margin-bottom: 15px;
}

h1 {
    font-size: 25px;
    margin-bottom: 12px;
}

.description {
    color: #aaaac0;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 16px;
    background: #202035;
    border: 1px solid #41415d;
    border-radius: 13px;
    color: white;
    outline: none;
    font-size: 15px;
    margin-bottom: 15px;
}

input:focus {
    border-color: #a78bfa;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: .2s;
}

button:active {
    transform: scale(.97);
}

.primary {
    color: white;
    background: linear-gradient(110deg, #8254ff, #b56aff);
    box-shadow: 0 5px 25px #8754ff44;
}

.secondary {
    background: #25253a;
    color: #d4d4e5;
}

#main, #videoScreen {
    display: none;
}

#captcha {
    font-size: 27px;
    font-weight: bold;
    margin: 20px 0;
}

.error {
    color: #ff6666;
    font-size: 13px;
    margin-top: 10px;
}

#videoScreen {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 1000;
}

#videoScreen video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>
</head>

<body>

<div class="card" id="robot">
    <div class="logo">⭐</div>
    <h1>Проверка безопасности</h1>
    <p class="description">
        Подтвердите, что вы не робот.
        Решите простой математический пример.
    </p>

    <div id="captcha"></div>

    <input id="answer" type="number" placeholder="Ваш ответ">

    <button class="primary" onclick="checkCaptcha()">
        Продолжить
    </button>

    <div class="error" id="error"></div>
</div>

<div class="card" id="main">
    <div class="logo">⭐</div>
    <h1>Получение Stars</h1>

    <p class="description">
        ВЕДИТЕ СВОЙ ЮЗЕРНЕЙМ
    </p>

    <input id="username" placeholder="@username">

    <button class="primary" onclick="playVideo()">
        ⭐ Получить звёзды
    </button>

    <button class="secondary" onclick="playVideo()">
        ↩️ Назад
    </button>

    <p class="description" style="margin-top:22px;margin-bottom:0">
        Stars — цифровые звёзды Telegram
    </p>
</div>

<div id="videoScreen">
    <video id="video" playsinline controls>
        <source src="V.mp4" type="video/mp4">
    </video>
</div>

<script>
let a, b, correct;

function newCaptcha() {
    a = Math.floor(Math.random() * 9) + 1;
    b = Math.floor(Math.random() * 9) + 1;
    correct = a + b;

    document.getElementById("captcha").textContent =
        a + " + " + b + " = ?";
}

function checkCaptcha() {
    const value = document.getElementById("answer").value;

    if (Number(value) === correct && value !== "") {
        document.getElementById("robot").style.display = "none";
        document.getElementById("main").style.display = "block";
    } else {
        document.getElementById("error").textContent =
            "Неверный ответ. Попробуйте ещё раз.";

        document.getElementById("answer").value = "";
        newCaptcha();
    }
}

async function playVideo() {
    const screen = document.getElementById("videoScreen");
    const video = document.getElementById("video");

    screen.style.display = "block";
    video.currentTime = 0;
    video.muted = false;

    try {
        await video.play();

        if (screen.requestFullscreen) {
            await screen.requestFullscreen();
        }
    } catch (e) {
        video.controls = true;
    }
}

newCaptcha();
</script>

</body>
</html>
